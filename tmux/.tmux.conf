# --- Core settings ---
set -g mouse on
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g status-position top
set -g history-limit 50000

set -g status-left-length 100
set -g status-interval 5

# --- TPM Plugin Manager ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'

# --- Catppuccin Theme (via TPM recommended) ---
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# --- Net Speed formatting ---
set -g @download_speed_format "%10s"
set -g @upload_speed_format "%10s"
set -g @net_speed_format "󰇚 %10s 󰕒 %10s"

# --- Status line configuration ---
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_net_speed}"

# --- Keybindings ---
set -g prefix C-b
unbind C-a
bind C-b send-prefix
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# synchronize panes: send current path to all panes
bind d run-shell 'tmux list-panes -F "#{pane_id}" | grep -v "^#{pane_id}$" | xargs -I{} tmux send-keys -t {} " cd #{pane_current_path}" Enter'

# Toggle synchronized panes
bind y setw synchronize-panes \; \
      display "Sync Panes: #{?pane_synchronized,on,off}"

# Quick reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Plugin install/update bindings (TPM)
bind I run "~/.tmux/plugins/tpm/bin/install_plugins"
bind U run "~/.tmux/plugins/tpm/bin/update_plugins"

# --- Resurrect settings ---
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# --- Initialize TPM (must be last line) ---
run '~/.tmux/plugins/tpm/tpm'

