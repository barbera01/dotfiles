# Catppuccin Mocha — Azure / cloud-native powerline theme
# Powerline style; requires a Nerd Font.
# Separator glyphs use \u escapes so they can't be stripped by editors.
#   \ue0b0 =   \ue0b2 =   \ue0b4 =   \ue0b6 = 

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

format = """
$kubernetes\
$azure\
$line_break\
[\ue0b6](mauve)\
$username\
$hostname\
[\ue0b0](fg:mauve bg:peach)\
$directory\
[\ue0b0](fg:peach bg:green)\
$git_branch\
$git_status\
[\ue0b0](fg:green bg:surface1)\
$status\
[\ue0b4](surface1)\
$fill\
$time\
$line_break\
$character"""

add_newline = true

# ─── Palette ──────────────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
overlay0  = "#6c7086"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
crust     = "#11111b"

# ─── Session: user@host ───────────────────────────────────────────────
[username]
show_always = true
style_user = "fg:crust bg:mauve"
style_root = "fg:crust bg:mauve"
format = "[ $user](\u0024style)"

[hostname]
ssh_only = false
style = "fg:crust bg:mauve"
format = "[$ssh_symbol@$hostname ](\u0024style)"
ssh_symbol = "\U000F08C0 "

# ─── Path ─────────────────────────────────────────────────────────────
[directory]
style = "fg:crust bg:peach"
format = "[  $path ](\u0024style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " \uf023 "
read_only_style = "fg:crust bg:peach"

# ─── Git ──────────────────────────────────────────────────────────────
[git_branch]
symbol = "\ue725 "
style = "fg:crust bg:green"
format = "[ $symbol$branch ](\u0024style)"

[git_status]
style = "fg:crust bg:green"
format = "[($all_status$ahead_behind )](\u0024style)"
conflicted = "\u2694 "
ahead = "\u21e1${count} "
behind = "\u21e3${count} "
diverged = "\u21d5\u21e1${ahead_count}\u21e3${behind_count} "
untracked = "?${count} "
stashed = "\ueb4b ${count} "
modified = "\uf044 ${count} "
staged = "\uf046 ${count} "
renamed = "\u00bb${count} "
deleted = "\uf014 ${count} "

# ─── Status (exit code) ───────────────────────────────────────────────
[status]
style = "fg:text bg:surface1"
format = "[ $symbol ](\u0024style)"
symbol = "[\uf00d](fg:red bg:surface1) "
success_symbol = "[\uf42e](fg:green bg:surface1)"
not_executable_symbol = "[\uf05e](fg:peach bg:surface1) "
not_found_symbol = "[\uf128](fg:peach bg:surface1) "
sigint_symbol = "[\uf04d](fg:red bg:surface1) "
signal_symbol = "[\u26a1](fg:yellow bg:surface1) "
map_symbol = true
disabled = false

# ─── Right-aligned filler + clock ─────────────────────────────────────
[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[\ue0b2](surface0)[ \ue641 $time ](fg:subtext1 bg:surface0)[\ue0b4](surface0)"

# ─── Top line: Kubernetes + Azure ─────────────────────────────────────
[kubernetes]
disabled = false
symbol = "\U000F0830 "
style = "fg:crust bg:sapphire"
format = "[\ue0b6](sapphire)[ $symbol $context( - $namespace) ](\u0024style)[\ue0b0](fg:sapphire bg:blue)"

[azure]
disabled = false
symbol = "\U000F0805 "
style = "fg:crust bg:blue"
format = "[ $symbol $subscription ](\u0024style)[\ue0b0](blue)"

# ─── Prompt character (third line) ────────────────────────────────────
[character]
success_symbol = "[\u276f](bold green)"
error_symbol = "[\u276f](bold red)"
